<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#08020e" />
  <title>ایییییی | شوخی صوتی</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: #08020e;
    }

    body {
      display: grid; place-items: center; isolation: isolate;
      font-family: Tahoma, system-ui, sans-serif;
      background:
        radial-gradient(ellipse at 15% 18%, rgba(255, 0, 105, .13), transparent 38%),
        radial-gradient(ellipse at 85% 82%, rgba(87, 39, 255, .17), transparent 42%),
        #08020e;
    }

    /* قبل از شروع، تنها عنصر قابل دیدن همین دکمه است. */
    #startButton {
      position: fixed; z-index: 20; left: 50%; top: 50%;
      width: 82px; height: 82px; padding: 0;
      border: 1px solid rgba(255,255,255,.24); border-radius: 50%;
      outline: 0; background: rgba(255,255,255,.018);
      cursor: pointer; transform: translate(-50%, -50%);
      -webkit-tap-highlight-color: transparent;
      transition: opacity .45s ease, transform .45s ease, border-color .25s ease;
    }
    #startButton:hover {
      border-color: rgba(255,255,255,.72);
      transform: translate(-50%, -50%) scale(1.07);
    }
    #startButton:active { transform: translate(-50%, -50%) scale(.92); }
    body.started #startButton {
      opacity: 0; pointer-events: none;
      transform: translate(-50%, -50%) scale(2.4);
    }

    #prankFx {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      overflow: hidden; opacity: 0; transition: opacity .25s ease;
      background:
        repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.025) 4px 5px),
        radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,.58) 100%);
    }
    #prankFx::before, #prankFx::after {
      content: ""; position: absolute; inset: -40%; opacity: 0;
      mix-blend-mode: screen; pointer-events: none;
    }
    #prankFx::before {
      background: conic-gradient(from 0deg, transparent, rgba(255,0,100,.25), transparent 28%, rgba(65,30,255,.25), transparent 65%, rgba(0,230,255,.13), transparent);
      animation: spin 7s linear infinite;
    }
    #prankFx::after {
      background: radial-gradient(circle at center, rgba(255,0,130,.16), transparent 65%);
      animation: pulse .8s ease-in-out infinite alternate;
    }
    body.started #prankFx, body.started #prankFx::before,
    body.started #prankFx::after { opacity: 1; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { from { transform: scale(.75); } to { transform: scale(1.3); } }

    .floating-text {
      position: fixed; z-index: 5; left: 0; top: 0;
      color: hsl(var(--hue), 100%, 72%);
      font: 1000 var(--size, 46px)/1 Tahoma, system-ui, sans-serif;
      white-space: nowrap; pointer-events: none; user-select: none;
      text-shadow:
        3px 3px 0 rgba(255,0,90,.72),
        -3px -2px 0 rgba(40,95,255,.76),
        0 0 16px currentColor, 0 0 34px currentColor;
      will-change: transform, opacity;
      animation: fly var(--duration, 2.5s) cubic-bezier(.12,.72,.18,1) forwards;
    }
    .floating-text.glitch {
      z-index: 6; filter: blur(.35px);
      animation-name: flyGlitch;
    }
    @keyframes fly {
      0% { opacity: 0; transform: translate3d(var(--x0), var(--y0), 0) rotate(var(--r0)) scale(.25); filter: blur(9px); }
      12% { opacity: 1; filter: blur(0); }
      76% { opacity: 1; }
      100% { opacity: 0; transform: translate3d(var(--x1), var(--y1), 0) rotate(var(--r1)) scale(var(--scale)); filter: blur(3px); }
    }
    @keyframes flyGlitch {
      0% { opacity: 0; transform: translate3d(var(--x0), var(--y0), 0) rotate(var(--r0)) scale(.15) skew(-18deg); filter: blur(12px); }
      15% { opacity: 1; filter: blur(0); }
      50% { transform: translate3d(calc(var(--x1) * .48), calc(var(--y1) * .48), 0) rotate(var(--r1)) scale(1.15) skew(8deg); }
      100% { opacity: 0; transform: translate3d(var(--x1), var(--y1), 0) rotate(var(--r1)) scale(var(--scale)) skew(-5deg); filter: blur(4px); }
    }

    body.bump { animation: bump .16s linear; }
    @keyframes bump {
      0%, 100% { translate: 0 0; }
      25% { translate: 3px -2px; }
      50% { translate: -3px 2px; }
      75% { translate: 2px 2px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #prankFx::before, #prankFx::after { animation-duration: 2s; }
    }
  </style>
</head>
<body>
  <button id="startButton" type="button" aria-label="شروع"></button>
  <div id="prankFx" aria-hidden="true"></div>

  <script>
    // همه فایل‌های صوتی باید کنار index.html باشند.
    // نام فایل‌ها با حروف بزرگ/کوچک دقیقاً مطابق این فهرست باشد.
    const SOUND_FILES = [
      "./ei.mp3",
      "./S1.mp3",
      "./S2.mp3",
      "./S3.mp3",
      "./S4.mp3",
      "./S5.mp3",
      "./S6.mp3"
    ];
    const TEXT = "اییییییی";
    const button = document.getElementById("startButton");

    let started = false;
    let activeAudios = [];
    let spawnTimer = null;
    let bumpTimer = null;

    const random = (min, max) => Math.random() * (max - min) + min;

    function makeText() {
      const node = document.createElement("div");
      node.className = Math.random() < .28 ? "floating-text glitch" : "floating-text";
      node.textContent = TEXT;

      const w = window.innerWidth;
      const h = window.innerHeight;
      const edge = 150;
      const side = Math.floor(Math.random() * 4);
      let x, y, endX, endY;

      if (side === 0) {
        x = -edge; y = random(0, h); endX = random(w * .12, w * .88); endY = random(0, h);
      } else if (side === 1) {
        x = w + edge; y = random(0, h); endX = random(w * .12, w * .88); endY = random(0, h);
      } else if (side === 2) {
        x = random(0, w); y = -edge; endX = random(0, w); endY = random(h * .12, h * .88);
      } else {
        x = random(0, w); y = h + edge; endX = random(0, w); endY = random(h * .12, h * .88);
      }

      const duration = random(1.8, 3.8);
      node.style.left = x + "px";
      node.style.top = y + "px";
      node.style.setProperty("--x0", "0px");
      node.style.setProperty("--y0", "0px");
      node.style.setProperty("--x1", (endX - x) + "px");
      node.style.setProperty("--y1", (endY - y) + "px");
      node.style.setProperty("--r0", random(-35, 35) + "deg");
      node.style.setProperty("--r1", random(-50, 50) + "deg");
      node.style.setProperty("--scale", random(.65, 1.7));
      node.style.setProperty("--duration", duration + "s");
      node.style.setProperty("--size", random(28, 76) + "px");
      node.style.setProperty("--hue", Math.floor(random(0, 360)));

      document.body.appendChild(node);
      window.setTimeout(() => node.remove(), duration * 1000 + 100);
    }

    function bumpScreen() {
      document.body.classList.remove("bump");
      void document.body.offsetWidth;
      document.body.classList.add("bump");
      clearTimeout(bumpTimer);
      bumpTimer = window.setTimeout(() => document.body.classList.remove("bump"), 180);
    }

    function playSound(file) {
      // سقف صداهای هم‌زمان برای حفظ روان بودن مرورگر؛ قدیمی‌ترین نمونه جایش را به جدید می‌دهد.
      if (activeAudios.length >= 22) {
        const oldest = activeAudios.shift();
        oldest.pause();
        oldest.src = "";
      }

      const audio = new Audio(file);
      audio.preload = "auto";
      audio.volume = random(.07, .15);

      // فقط ei و S1 تا S3 افکت تغییر سرعت و زیر و بمی می‌گیرند.
      // فایل‌های S4 تا S6 کاملاً با سرعت و زیر و بمی اصلی پخش می‌شوند.
      const keepOriginalSound = /^\.\/S[4-6]\.mp3$/i.test(file);
      if (keepOriginalSound) {
        audio.playbackRate = 1;
        audio.preservesPitch = true;
        audio.mozPreservesPitch = true;
        audio.webkitPreservesPitch = true;
      } else {
        const rates = [.48, .58, .72, .84, 1, 1.18, 1.38, 1.65, 1.95, 2.3, 2.65];
        audio.playbackRate = rates[Math.floor(Math.random() * rates.length)];
        audio.preservesPitch = false;
        audio.mozPreservesPitch = false;
        audio.webkitPreservesPitch = false;
      }

      activeAudios.push(audio);
      audio.addEventListener("ended", () => {
        activeAudios = activeAudios.filter(item => item !== audio);
        audio.src = "";
      }, { once: true });
      audio.addEventListener("error", () => {
        activeAudios = activeAudios.filter(item => item !== audio);
      }, { once: true });

      // متن دقیقاً در همان نوبتی ساخته می‌شود که نمونه‌ی صوتی شروع می‌شود.
      makeText();
      if (Math.random() < .36) makeText();
      bumpScreen();

      audio.play().catch(() => {
        // اگر فایل ei.mp3 کنار index.html نباشد، افکت‌های تصویری همچنان اجرا می‌شوند.
      });
    }

    let previousFile = "";
    function chooseSound() {
      // صداها تصادفی انتخاب می‌شوند و تا حد ممکن دو بار پشت سر هم تکرار نمی‌شوند.
      const choices = SOUND_FILES.filter(file => file !== previousFile);
      const file = choices[Math.floor(Math.random() * choices.length)];
      previousFile = file;
      return file;
    }

    function scheduleNextSound() {
      // فاصله‌ی نامنظم و کوتاه، حس تکرار شلوغ و روی‌هم‌افتاده ایجاد می‌کند.
      const delay = random(65, 135);
      spawnTimer = window.setTimeout(() => {
        playSound(chooseSound());
        scheduleNextSound();
      }, delay);
    }

    button.addEventListener("click", () => {
      if (started) return;
      started = true;
      document.body.classList.add("started");
      // شروع با ei.mp3؛ بعد از آن S1 تا S6 و ei.mp3 به شکل تصادفی می‌آیند.
      previousFile = "./ei.mp3";
      playSound("./ei.mp3");
      scheduleNextSound();
    }, { once: true });
  </script>
</body>
</html>
