.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#24374c;border:1px solid #526b85;border-radius:12px;padding:11px 17px;font-size:11px;transition:.22s;z-index:20;box-shadow:0 18px 50px #0005}.toast.show{opacity:1;transform:translate(-50%,0)}
.light{color-scheme:light;--bg:#f0f3f8;--text:#172337;--muted:#64748b;background:radial-gradient(ellipse at 8% 0%,#bfeaf044,transparent 32%),radial-gradient(ellipse at 92% 15%,#d8cfff66,transparent 30%),var(--bg)}.light .topbar{background:#f0f3f8e8;border-color:#1b304014}.light .brand{color:#172337}.light .brandcopy small{color:#64748b}.light .search{background:#fff;border-color:#d2dce8}.light .search input{color:#172337}.light .intro{background:linear-gradient(115deg,#d9f4f5,#e5e0ff 70%,#f2e3f1);border-color:#d6dcec}.light .intro h1{color:#18283c}.light .intro p,.light .stat span{color:#54657b}.light .stat strong{color:#24364c}.light .featured{color:#345e78;border-color:#ffffffa0;background:#ffffff70}.light .boardtitle p,.light .sort{color:#65758a}.light .chip{color:#526178;background:#ffffffa8;border-color:#d5deea}.light .chip.active{color:#0c1b29;border-color:#69d9e5;background:linear-gradient(120deg,#69d9e5,#9b8cff)}.light .sort select{background:#fff;color:#27374c;border-color:#d5deea}.light .sound:hover{background:#fff;border-color:#e1e8f0}.light .soundname{color:#25364b}.light .soundname:hover{color:#078da6}.light .status,.light footer{color:#6e7d91}.light footer{border-color:#dbe3ec}.light .footerbrand{color:#33465e}.light .admin{color:#5b6e84}.light dialog{background:#fff;color:#172337;border-color:#d7e0ea}.light .field{color:#34475e}.light .field input,.light .field select{background:#f8fafc;color:#172337;border-color:#d5deea}.light .pendingitem{border-color:#d5deea}.light .file{border-color:#8bcbd6}
@media(max-width:1160px){.grid{grid-template-columns:repeat(7,minmax(0,1fr))}}@media(max-width:900px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}.intro{padding:25px}.intro h1{font-size:32px}}
@media(max-width:680px){.topinner,.wrap,footer{width:calc(100% - 26px)}.topinner{min-height:66px;gap:10px}.brandmark{width:38px;height:38px;border-radius:12px}.brandcopy strong{font-size:16px}.brandcopy small{font-size:8px}.tools{gap:7px}.search{width:min(42vw,210px);height:39px;padding:0 10px}.tools .btn{padding:9px 11px;font-size:10px}.iconbtn{width:38px;height:38px}.intro{margin-top:18px;padding:21px;border-radius:19px;gap:12px}.intro h1{font-size:27px}.intro p{font-size:10px}.introaction{gap:8px}.featured{width:53px;height:53px;border-radius:16px;font-size:22px}.stat{min-width:55px}.stat strong{font-size:18px}.stat span{font-size:8px}.board{padding-top:25px}.boardtitle h2{font-size:17px}.grid{grid-template-columns:repeat(4,minmax(0,1fr));column-gap:5px;row-gap:18px}.sound{padding:10px 2px;border-radius:14px}.soundbutton{width:clamp(65px,15vw,82px);height:clamp(65px,15vw,82px)}.soundname{font-size:10px;min-height:35px}.round{width:24px;height:24px}.filters{gap:6px;margin-bottom:18px}.chip{padding:7px 11px;font-size:9px}}
@media(max-width:390px){.brandcopy small{display:none}.tools .btn{font-size:0;width:37px;height:37px;padding:0}.tools .btn:before{content:"＋";font-size:16px}.search{width:39vw}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.intro{align-items:flex-start}.introaction{flex-direction:column}.stat{min-width:0}.sort{font-size:0}.sort select{font-size:9px}}
</style>

<body>
<header class="topbar"><div class="topinner">
<a class="brand" href="#top" aria-label="صداخونه"><span class="brandmark"><i></i><i></i><i></i><i></i><i></i></span><span class="brandcopy"><strong>صداخونه</strong><small>SOUND BUTTONS</small></span></a>
<div class="tools"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="دنبال چه صدایی می‌گردی؟" aria-label="جست‌وجوی صدا"></label><button class="iconbtn" id="theme" title="تغییر پوسته" aria-label="تغییر پوسته">◐</button><button class="btn primary" id="openUpload">＋ افزودن صدا</button></div>
</div></header>
<main class="wrap" id="top">
<section class="intro"><div class="introcopy"><div class="eyebrow"><i class="dot"></i> SOUNDKHUNEH • PLAY SOMETHING</div><h1>هر صدا، <span>یه دکمه!</span></h1><p>بزن، گوش کن، بفرست برای بقیه.</p></div><div class="introaction"><button class="featured" id="playFeatured" aria-label="پخش صدای ویژه">♫</button><div class="stat"><strong id="soundCount">۱</strong><span>دکمهٔ صدا</span></div></div></section>
<section class="board" id="sounds"><div class="boardhead"><div class="boardtitle"><span class="boardmark">▦</span><div><h2>گالری صداها</h2><p id="resultsSubtitle">همهٔ دکمه‌ها در یک جا</p></div></div><label class="sort">مرتب‌سازی<select id="sort"><option value="new">تازه‌تر</option><option value="popular">محبوب‌تر</option><option value="az">الفبایی</option></select></label></div>
<div class="filters" id="filters"><button class="chip active" data-filter="همه">همه</button><button class="chip" data-filter="میم">😂 میم</button><button class="chip" data-filter="بازی">🎮 بازی</button><button class="chip" data-filter="واکنش">😮 واکنش</button><button class="chip" data-filter="حیوانات">🐸 حیوانات</button><button class="chip" data-filter="دیگر">✨ متفرقه</button><button class="chip" data-filter="علاقه‌مندی‌ها">♥ ذخیره‌شده‌ها</button></div>
<div class="grid" id="grid" aria-live="polite"></div><div class="empty" id="empty" hidden>هیچ صدایی پیدا نشد.</div><p class="status" id="apiStatus">در حال اتصال به کتابخانهٔ صداها…</p></section>
</main>
<footer><span class="footerbrand"><i class="footerdot"></i> صداخونه</span><span>یک کلیک تا صدا 🎧</span><button class="admin" id="openAdmin">مدیریت محتوا</button></footer>
<dialog id="uploadDialog"><form class="modal" id="uploadForm"><button class="close" type="button" data-close="uploadDialog">×</button><h2>افزودن صدای تازه 🎧</h2>
<label class="field">اسم صدا<input name="title" maxlength="42" required placeholder="یک اسم کوتاه و بامزه"></label><label class="field">نام سازنده<input name="author" maxlength="22" placeholder="ناشناس"></label><label class="field">دسته‌بندی<select name="category"><option>میم</option><option>بازی</option><option>واکنش</option><option>حیوانات</option><option>دیگر</option></select></label>
<label class="file"><b id="fileName">انتخاب فایل صوتی</b><small>MP3 · WAV · OGG · WEBM · M4A · حداکثر ۴۵۰ کیلوبایت</small><input id="file" name="file" type="file" accept="audio/*,.mp3,.wav,.ogg,.webm,.m4a,.aac" required></label><audio id="preview" controls hidden style="width:100%;margin-top:10px"></audio><p class="message" id="uploadMessage" role="status"></p><button class="btn primary" type="submit" id="submit">ارسال صدا برای بررسی</button></form></dialog>
<dialog id="adminDialog"><div class="modal"><button class="close" data-close="adminDialog">×</button><h2>مدیریت محتوا</h2><form id="adminForm"><label class="field">کلید مدیر<input id="adminKey" type="password" autocomplete="off" required></label><button class="btn primary" type="submit">ورود به صف بررسی</button></form><p class="message" id="adminMessage"></p><div class="pending" id="pending"></div></div></dialog>
<div class="toast" id="toast"></div>
<script>
(()=>{"use strict";
const API="https://soundboard-api.atbeen.workers.dev", $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const local={id:"ei-local",title:"EI!",category:"واکنش",author:"صداخونه",plays:0,local:true,created_at:"2026-01-01"};
const colors=["red","blue","green","orange","purple"],categoryColors={"میم":"red","بازی":"blue","واکنش":"purple","حیوانات":"green","دیگر":"orange"};
let sounds=[],filter="همه",query="",sort="new",playing=null,adminKey="",previewUrl="";
const favKey="soundkhuneh-favorites-v1";
const favorites=()=>{try{return new Set(JSON.parse(localStorage.getItem(favKey)||"[]"))}catch{return new Set()}};
const number=n=>new Intl.NumberFormat("fa-IR").format(Number(n||0));
function toast(s){const t=$("#toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}
function open(id){const d=$("#"+id);if(!d.open)d.showModal()}function close(id){const d=$("#"+id);if(d.open)d.close()}
function soundColor(s,i){return categoryColors[s.category]||colors[i%colors.length]}
function play(url,button,id){if(playing){playing.pause();playing=null;$$(".soundbutton.playing").forEach(x=>x.classList.remove("playing"));$("#playFeatured").classList.remove("playing")}
const a=new Audio(url);playing=a;if(button)button.classList.add("playing");a.onended=()=>{if(button)button.classList.remove("playing");if(playing===a)playing=null};a.onerror=()=>{if(button)button.classList.remove("playing");toast(id==="ei-local"?"فایل EI پیدا نشد.":"پخش صدا ممکن نشد.")};a.play().then(()=>{if(id&&id!=="ei-local")fetch(API+"/api/sounds/"+encodeURIComponent(id)+"/play",{method:"POST"}).catch(()=>{})}).catch(()=>toast("پخش صدا ممکن نشد."))}
function card(s,i){const el=document.createElement("article");el.className="sound";el.id="sound-"+encodeURIComponent(s.id);
const btn=document.createElement("button");btn.className="soundbutton";btn.type="button";btn.setAttribute("aria-label","پخش "+s.title);btn.title="پخش "+s.title;
const img=document.createElement("img");img.src="./assets/buttons/"+soundColor(s,i)+".png";img.alt="";img.loading="lazy";img.decoding="async";img.draggable=false;img.onerror=()=>{img.remove();btn.classList.add("fallback");btn.textContent="♫"};btn.append(img);
btn.onclick=()=>play(s.local?"./assets/ei.mp3":API+"/api/sounds/"+encodeURIComponent(s.id)+"/audio",btn,s.id);
const name=document.createElement("a");name.className="soundname";name.href="#"+el.id;name.textContent=s.title;name.title=s.title;
const actions=document.createElement("div");actions.className="actions";
const heart=document.createElement("button");heart.className="round heart";heart.type="button";heart.textContent=favorites().has(s.id)?"♥":"♡";if(favorites().has(s.id))heart.classList.add("active");heart.setAttribute("aria-label","ذخیره در علاقه‌مندی‌ها");heart.onclick=()=>{const f=favorites();f.has(s.id)?f.delete(s.id):f.add(s.id);localStorage.setItem(favKey,JSON.stringify([...f]));render()};
const link=document.createElement("button");link.className="round share";link.type="button";link.textContent="↗";link.setAttribute("aria-label","کپی لینک صدا");link.onclick=async()=>{const url=new URL(location.href);url.hash=el.id;try{await navigator.clipboard.writeText(url.toString());toast("لینک صدا کپی شد.")}catch{toast("کپی لینک در این مرورگر در دسترس نیست.")}};
actions.append(heart,link);el.append(btn,name,actions);return el}
function render(){let all=[local,...sounds],items=filter==="علاقه‌مندی‌ها"?all.filter(s=>favorites().has(s.id)):all.filter(s=>filter==="همه"||s.category===filter);if(query)items=items.filter(s=>(s.title+" "+(s.author||"")).toLocaleLowerCase().includes(query));
if(sort==="popular")items.sort((a,b)=>Number(b.plays||0)-Number(a.plays||0));else if(sort==="az")items.sort((a,b)=>a.title.localeCompare(b.title,"fa"));else items.sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
$("#grid").replaceChildren(...items.map((s,i)=>card(s,i)));$("#empty").hidden=items.length>0;$("#soundCount").textContent=number(sounds.length+1);$("#resultsSubtitle").textContent=number(items.length)+" دکمه در این بخش"}
async function load(){try{const r=await fetch(API+"/api/sounds",{headers:{Accept:"application/json"}});if(!r.ok)throw Error("HTTP "+r.status);const d=await r.json();sounds=Array.isArray(d.sounds)?d.sounds:[];$("#apiStatus").textContent=""}catch(e){$("#apiStatus").textContent="اتصال به کتابخانه برقرار نشد؛ صدای ویژه همچنان در دسترس است."}render()}
$("#playFeatured").onclick=()=>play("./assets/ei.mp3",$("#playFeatured"),"ei-local");$("#openUpload").onclick=()=>open("uploadDialog");$("#openAdmin").onclick=()=>open("adminDialog");
$$("[data-close]").forEach(b=>b.onclick=()=>close(b.dataset.close));["uploadDialog","adminDialog"].forEach(id=>$("#"+id).addEventListener("click",e=>{if(e.target===e.currentTarget)close(id)}));
$("#theme").onclick=()=>document.body.classList.toggle("light");$("#filters").onclick=e=>{const b=e.target.closest("[data-filter]");if(!b)return;filter=b.dataset.filter;$$(".chip").forEach(x=>x.classList.toggle("active",x===b));render()};
$("#search").oninput=e=>{query=e.target.value.trim().toLocaleLowerCase();render()};$("#sort").onchange=e=>{sort=e.target.value;render()};
$("#file").onchange=e=>{const f=e.target.files[0];$("#fileName").textContent=f?f.name:"انتخاب فایل صوتی";if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl="";$("#preview").hidden=true;if(!f)return;if(f.size>450*1024){$("#uploadMessage").textContent="حجم فایل بیشتر از ۴۵۰ کیلوبایت است.";return}previewUrl=URL.createObjectURL(f);$("#preview").src=previewUrl;$("#preview").hidden=false};
$("#uploadForm").onsubmit=async e=>{e.preventDefault();const f=$("#file").files[0],m=$("#uploadMessage"),b=$("#submit");m.className="message";m.textContent="";if(!f){m.textContent="یک فایل انتخاب کن.";return}if(f.size>450*1024){m.textContent="حجم فایل بیشتر از ۴۵۰ کیلوبایت است.";return}b.disabled=true;b.textContent="در حال ارسال…";try{const r=await fetch(API+"/api/sounds",{method:"POST",body:new FormData(e.currentTarget)}),d=await r.json();if(!r.ok)throw Error(d.error||"ارسال ناموفق بود.");m.textContent=d.message||"صدات برای بررسی ارسال شد.";e.currentTarget.reset();$("#preview").hidden=true;$("#fileName").textContent="انتخاب فایل صوتی";toast("صدا ارسال شد؛ بعد از تأیید منتشر می‌شود.")}catch(x){m.className="message error";m.textContent=x.message}finally{b.disabled=false;b.textContent="ارسال صدا برای بررسی"}};
$("#adminForm").onsubmit=async e=>{e.preventDefault();adminKey=$("#adminKey").value.trim();const m=$("#adminMessage"),box=$("#pending");m.textContent="در حال دریافت…";box.replaceChildren();try{const r=await fetch(API+"/api/admin/pending",{headers:{Authorization:"Bearer "+adminKey}}),d=await r.json();if(!r.ok)throw Error(d.error||"کلید مدیر معتبر نیست.");if(!d.sounds?.length){m.textContent="صف بررسی خالی است.";return}m.textContent="";for(const s of d.sounds){const item=document.createElement("div");item.className="pendingitem";const meta=document.createElement("div"),title=document.createElement("b"),sub=document.createElement("small");title.textContent=s.title;sub.textContent=(s.author||"ناشناس")+" · "+s.category;meta.append(title,sub);const actions=document.createElement("div");actions.className="pendingactions";for(const action of ["approve","reject"]){const b=document.createElement("button");b.className=action;b.textContent=action==="approve"?"تأیید":"رد";b.onclick=async()=>{b.disabled=true;try{const res=await fetch(API+"/api/admin/sounds/"+encodeURIComponent(s.id)+"/"+action,{method:"POST",headers:{Authorization:"Bearer "+adminKey}});if(!res.ok)throw Error("عملیات ناموفق بود");item.remove();toast(action==="approve"?"صدا منتشر شد.":"صدا رد شد.");if(action==="approve")load()}catch(x){m.textContent=x.message;b.disabled=false}};actions.append(b)}item.append(meta,actions);box.append(item)}}catch(x){m.className="message error";m.textContent=x.message}};
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k")$("#search").focus();if(e.key==="Escape"&&playing){playing.pause();playing=null;$$(".soundbutton.playing").forEach(x=>x.classList.remove("playing"));$("#playFeatured").classList.remove("playing")}});
load();
})();
</script>
</body>
</html>
