name: Deploy Soundkhuneh to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Prepare website files
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp -R assets dist/assets
          cp 404.html dist/404.html
          cp robots.txt dist/robots.txt
          cp -R prank dist/prank
          python scripts/remove-button-backgrounds.py --output dist/assets/buttons
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
